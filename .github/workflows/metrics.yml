name: Metrics

# Dormant until you add a Personal Access Token.
# 1. Create a token at https://github.com/settings/tokens (classic; scope: public_repo,
#    plus read:org for organization stats).
# 2. Add it under Settings > Secrets and variables > Actions > New repository secret,
#    named METRICS_TOKEN.
# The job below skips cleanly (stays green) until that secret exists, so it never
# shows a red run. Once the secret is added and the job runs, uncomment the
# "## Activity" metrics line in README.md to display assets/metrics.svg.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for token
        id: guard
        run: |
          if [ -n "${{ secrets.METRICS_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "METRICS_TOKEN not set — skipping. Add the secret to enable metrics."
          fi

      - name: Generate metrics.svg
        if: steps.guard.outputs.ready == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_output: svg
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_lines: yes
          committer_message: "chore: update metrics [skip ci]"
