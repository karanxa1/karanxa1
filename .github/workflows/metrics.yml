name: Metrics

# Requires a Personal Access Token stored as the repo secret METRICS_TOKEN.
# Create it at https://github.com/settings/tokens (classic, scope: public_repo;
# add read:org for organization stats), then add it under
# Settings > Secrets and variables > Actions > New repository secret > METRICS_TOKEN.
# Until that secret exists this workflow will fail — that is expected.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_output: svg
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_lines: yes
          committer_message: "chore: update metrics [skip ci]"
