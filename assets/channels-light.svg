<svg xmlns="http://www.w3.org/2000/svg" width="880" height="104" viewBox="0 0 880 104" role="img" aria-label="Channels: WHATSAPP, INSTAGRAM, FACEBOOK, VOICE, EMAIL, WEB CHAT">
  <title>Channels</title>
  <defs>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="-22" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#16181d" stop-opacity="0"/>
      <stop offset="1" stop-color="#16181d" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; }
    .lbl  { font-size: 10.5px; letter-spacing: 0.18em; fill: #5b6472; }
    .ring { fill: none; stroke: #c7ccd4; stroke-width: 1.5; }
    .dot  {
      fill: #16181d; opacity: 0.5;
      transform-box: fill-box; transform-origin: center;
      animation: pulse 4.4s ease-in-out infinite;
    }
    .sweep { animation: sweep 4.4s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
    .sweep-dot   { fill: #16181d; }
    .sweep-trail { stroke: url(#trail); stroke-width: 3; stroke-linecap: round; }
    @keyframes sweep {
      0%   { transform: translateX(0px); opacity: 0; }
      5%   { opacity: 1; }
      70%  { transform: translateX(666.67px); opacity: 1; }
      76%  { transform: translateX(666.67px); opacity: 0; }
      100% { transform: translateX(666.67px); opacity: 0; }
    }
    @keyframes pulse {
      0%   { transform: scale(0.7); opacity: 0.5; }
      4%   { transform: scale(1.75); opacity: 1; }
      11%  { transform: scale(0.7); opacity: 0.5; }
      100% { transform: scale(0.7); opacity: 0.5; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: 0.8; }
      .sweep { display: none; }
    }
  </style>

  <line class="rail" x1="40" y1="46" x2="840" y2="46" stroke="#d3d8df" stroke-width="1.5"/>

  <g transform="translate(106.67,46)">
    <circle class="ring" r="6"/>
    <circle class="dot" r="3" style="animation-delay:0.0s"/>
  </g>
  <text class="lbl" x="106.67" y="78" text-anchor="middle">WHATSAPP</text>
  <g transform="translate(240.00,46)">
    <circle class="ring" r="6"/>
    <circle class="dot" r="3" style="animation-delay:0.616s"/>
  </g>
  <text class="lbl" x="240.00" y="78" text-anchor="middle">INSTAGRAM</text>
  <g transform="translate(373.33,46)">
    <circle class="ring" r="6"/>
    <circle class="dot" r="3" style="animation-delay:1.232s"/>
  </g>
  <text class="lbl" x="373.33" y="78" text-anchor="middle">FACEBOOK</text>
  <g transform="translate(506.67,46)">
    <circle class="ring" r="6"/>
    <circle class="dot" r="3" style="animation-delay:1.848s"/>
  </g>
  <text class="lbl" x="506.67" y="78" text-anchor="middle">VOICE</text>
  <g transform="translate(640.00,46)">
    <circle class="ring" r="6"/>
    <circle class="dot" r="3" style="animation-delay:2.464s"/>
  </g>
  <text class="lbl" x="640.00" y="78" text-anchor="middle">EMAIL</text>
  <g transform="translate(773.33,46)">
    <circle class="ring" r="6"/>
    <circle class="dot" r="3" style="animation-delay:3.08s"/>
  </g>
  <text class="lbl" x="773.33" y="78" text-anchor="middle">WEB CHAT</text>

  <g transform="translate(106.67,46)">
    <g class="sweep">
      <line class="sweep-trail" x1="-22" y1="0" x2="0" y2="0"/>
      <circle class="sweep-dot" r="4"/>
    </g>
  </g>
</svg>
